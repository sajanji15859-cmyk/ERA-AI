[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "era-ai"
version = "0.7.0"
description = "ERA AI — autonomous agent with secure tools, PostgreSQL scale, signed audit, and replay-safe async execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Phase 3C: credential vault (AES-256-GCM at rest)
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["era*"]

[tool.setuptools.package-data]
# Phase 3E: web dashboard static assets (served by the FastAPI app at /).
"era.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "postgres: requires ERA_TEST_POSTGRES_URL pointing to a disposable PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` in defaults is the documented FastAPI dependency-injection idiom.
"era/api/routes/*.py" = ["B008"]
"era/api/deps.py" = ["B008"]
