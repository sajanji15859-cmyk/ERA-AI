[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "era-ai"
version = "0.5.0"
description = "ERA AI — autonomous agent (Phase 3A/3B/3C/3D: loop, tools, memory, verification, LLM, vault, GitHub, code-exec)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Phase 3C: credential vault (AES-256-GCM at rest)
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["era*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["agent.py", "brain.py", "chat.py", "config.py", "main.py", "memory.py", "research.py"]

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` in defaults is the documented FastAPI dependency-injection idiom.
"era/api/routes/*.py" = ["B008"]
"era/api/deps.py" = ["B008"]
