# Pre-commit hooks for ERA-AI.
# Usage:
#   pip install -e ".[dev]"
#   pre-commit install
# The ruff rev is pinned in sync with pyproject.toml's dev extra so local
# hooks and CI always use the same version.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        name: ruff check
        args: [--fix]
      - id: ruff-format
